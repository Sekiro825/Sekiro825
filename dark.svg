<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8">
      <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#A855F7">
      <animate attributeName="stop-color" values="#A855F7;#38BDF8;#818CF8;#A855F7" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#818CF8"/>
    <stop offset="50%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#020617"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
    <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.08"/>
    <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.75"/>
    <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#38BDF8" opacity="0.04"/>
  </pattern>
  <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1180" height="620">
    <rect x="0" y="0" width="1180" height="0" fill="#fff">
      <animate attributeName="height" from="0" to="560" dur="2.4s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </mask>
  <style>
    .ascii  { font-family: 'Courier New', Consolas, monospace; font-size: 7.6px; fill: url(#asciiGrad); letter-spacing: -0.2px; }
    .key    { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #38BDF8; font-weight: bold; }
    .value  { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #F1F5F9; }
    .cc     { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #475569; }
    .head   { font-family: 'Courier New', Consolas, monospace; font-size: 16px; fill: #A855F7; font-weight: bold; }
    .accent { font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #34D399; font-weight: bold; }
    text, tspan { white-space: pre; }
    .term-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #94A3B8; letter-spacing: 0.5px; }
    .scan-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #F87171; letter-spacing: 1px; }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #38BDF8; letter-spacing: 2px; opacity: 0.8; }
    .cursor-blink { fill: #38BDF8; }
  </style>
</defs>

<rect width="1180" height="610" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#0F172A" fill-opacity="0.9"/>
  <circle cx="24" cy="20" r="5" fill="#EF4444"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="20" r="5" fill="#F59E0B"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="20" r="5" fill="#10B981"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="590" y="25" text-anchor="middle" class="term-label">sekiro825@devos ~ % ./profile.sh --live</text>
  <circle cx="1122" cy="20" r="4" fill="#F87171">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="24" class="scan-label">LIVE</text>
</g>

